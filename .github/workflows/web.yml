name: Build web and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen CLI (exact version)
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Build web app
        run: cargo xtask web

      - name: Add host config files
        run: cp packaging/web/_headers packaging/web/.htaccess target/web/dist/

      - name: Publish dist to web-dist branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/web/dist
          publish_branch: web-dist
          force_orphan: true
