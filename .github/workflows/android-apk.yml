name: Android APK

# Builds the phone app (web build with the phone layout, wrapped in an Android WebView) and
# attaches the debug APK to the run. Start it from the Actions tab ("Run workflow"), or push a
# tag like android-v0.10.0.
on:
  workflow_dispatch:
  push:
    tags: ["android-v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: wasm-bindgen CLI (must match the crate version)
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: binaryen (smaller wasm)
        run: sudo apt-get update && sudo apt-get install -y binaryen imagemagick

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Build the APK
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: bash packaging/android/build-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: EffectCraft-android-apk
          path: packaging/android/out/*.apk
          if-no-files-found: error
